<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasat | EliteGym</title>

    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/classes.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- HERO -->
    <section class="classes-hero">
        <div class="overlay"></div>
        <div class="hero-content">
            <h1>Klasat tona</h1>
            <p>Zgjidh programin që i përshtatet objektivave të tua</p>
        </div>
    </section>

    <!-- CLASSES -->
    <main class="container">

        <div class="classes-grid">

            <!-- CARDIO -->
            <a href="class-cardio.html" class="class-card">
                <img src="images/cardio.jpg" alt="Cardio">

                <div class="content">
                    <h2>Cardio</h2>

                    <div class="chips">
                        <span><i class="fa-solid fa-fire"></i> 500–800 kcal</span>
                        <span><i class="fa-solid fa-clock"></i> 45 min</span>
                        <span><i class="fa-solid fa-user"></i> Beginner</span>
                    </div>
                </div>
            </a>

            <!-- STRENGTH -->
            <a href="class-strength.html" class="class-card">
                <img src="images/strength.jpg" alt="Strength">

                <div class="content">
                    <h2>Strength</h2>

                    <div class="chips">
                        <span><i class="fa-solid fa-dumbbell"></i> Muscle</span>
                        <span><i class="fa-solid fa-clock"></i> 60 min</span>
                        <span><i class="fa-solid fa-layer-group"></i> Intermediate</span>
                    </div>
                </div>
            </a>

            <!-- BOXING -->
            <a href="class-boxing.html" class="class-card">
                <img src="images/boxing.jpg" alt="Boxing">

                <div class="content">
                    <h2>Boxing</h2>

                    <div class="chips">
                        <span><i class="fa-solid fa-hand-fist"></i> HIIT</span>
                        <span><i class="fa-solid fa-clock"></i> 50 min</span>
                        <span><i class="fa-solid fa-bolt"></i> High</span>
                    </div>
                </div>
            </a>

            <!-- YOGA -->
            <a href="class-yoga.html" class="class-card">
                <img src="images/yoga.jpg" alt="Yoga">

                <div class="content">
                    <h2>Yoga</h2>

                    <div class="chips">
                        <span><i class="fa-solid fa-spa"></i> Relax</span>
                        <span><i class="fa-solid fa-clock"></i> 40 min</span>
                        <span><i class="fa-solid fa-infinity"></i> All levels</span>
                    </div>
                </div>
            </a>

            <!-- CROSSFIT -->
            <a href="class-crossfit.html" class="class-card">
                <img src="images/crossfit.jpg" alt="CrossFit">

                <div class="content">
                    <h2>CrossFit</h2>

                    <div class="chips">
                        <span><i class="fa-solid fa-bolt"></i> Extreme</span>
                        <span><i class="fa-solid fa-clock"></i> 60 min</span>
                        <span><i class="fa-solid fa-trophy"></i> Pro</span>
                    </div>
                </div>
            </a>

        </div>

    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- JS -->
    <script src="js/loadComponents.js"></script>

</body>

</html>
